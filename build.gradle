import proguard.gradle.ProGuardTask

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.9.1'
    }
}

plugins {
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "winterweather" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            programArgs "--msa"
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "com.ptsmods:devlogin:3.5.1:fabric"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)

    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

tasks.register("proguard", ProGuardTask) {
    dependsOn tasks.jar

    configuration file("proguard.pro")

    injars tasks.jar.archiveFile

    outjars layout.buildDirectory.file(
            "libs/${project.archives_base_name}-${project.version}-obfuscated.jar"
    )

    // Loom's client classpath contains the common classpath plus
    // the client-side Minecraft/dependencies.
    libraryjars configurations.clientCompileClasspath

    libraryjars "${System.getProperty('java.home')}/jmods/java.base.jmod"
    libraryjars "${System.getProperty('java.home')}/jmods/java.desktop.jmod"
    libraryjars "${System.getProperty('java.home')}/jmods/java.logging.jmod"
    libraryjars "${System.getProperty('java.home')}/jmods/java.management.jmod"
    libraryjars "${System.getProperty('java.home')}/jmods/java.naming.jmod"
    libraryjars "${System.getProperty('java.home')}/jmods/java.sql.jmod"
    libraryjars "${System.getProperty('java.home')}/jmods/java.xml.jmod"

    printmapping layout.buildDirectory.file(
            "proguard/${project.archives_base_name}.mapping"
    )
    printseeds layout.buildDirectory.file(
            "proguard/${project.archives_base_name}.seeds"
    )
    printusage layout.buildDirectory.file(
            "proguard/${project.archives_base_name}.usage"
    )
}

tasks.named("build") {
    dependsOn tasks.named("proguard")
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}