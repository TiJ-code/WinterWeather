name: Build

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master
    types:
      - closed

jobs:
  build:
    # Run on direct pushes, or only on PRs that were merged
    if: github.event_name == 'push' || github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: gradle build

